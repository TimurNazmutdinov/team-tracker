<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Схема архитектуры team-tracker</title>
  <desc id="d">Пользователи работают в браузере с приложением: экраны, логика, модуль хранения. Хранение читает seed.json и браузер сейчас, API и PostgreSQL потом. Внизу — цепочка разработки: GitHub, CI, демо на GitHub Pages.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="770" fill="#ffffff"/>

  <!-- Пользователи и браузер -->
  <rect x="40" y="30" width="300" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="190" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Пользователи</text>
  <text x="190" y="82" text-anchor="middle" font-size="15" fill="#1f2937">разработчики, продакты</text>
  <line x1="340" y1="65" x2="400" y2="65" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="400" y="30" width="300" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="550" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Браузер</text>
  <text x="550" y="82" text-anchor="middle" font-size="15" fill="#1f2937">открывает приложение по ссылке</text>

  <!-- Приложение -->
  <rect x="40" y="130" width="920" height="300" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="158" font-size="16" font-weight="bold" fill="#475569">Приложение</text>
  <path d="M500 100 V168 H195 V190" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="190" width="250" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Экраны</text>
  <text x="195" y="258" text-anchor="middle" font-size="15" fill="#1f2937">бэклог, доска, спринты,</text>
  <text x="195" y="280" text-anchor="middle" font-size="15" fill="#1f2937">задача, отчёты</text>

  <line x1="320" y1="265" x2="375" y2="265" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="375" y="190" width="250" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Логика</text>
  <text x="500" y="258" text-anchor="middle" font-size="15" fill="#1f2937">статусы, спринты,</text>
  <text x="500" y="280" text-anchor="middle" font-size="15" fill="#1f2937">story points, отчёты</text>

  <line x1="625" y1="265" x2="680" y2="265" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="680" y="190" width="250" height="150" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="805" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Модуль хранения</text>
  <text x="805" y="258" text-anchor="middle" font-size="15" fill="#1f2937">единый интерфейс,</text>
  <text x="805" y="280" text-anchor="middle" font-size="15" fill="#1f2937">единственный доступ к данным</text>

  <!-- Источники данных -->
  <path d="M730 340 V395 H630 V470" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M860 340 V470" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/>

  <rect x="500" y="470" width="260" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="502" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Сейчас</text>
  <text x="630" y="528" text-anchor="middle" font-size="15" fill="#1f2937">seed.json + браузер</text>

  <rect x="780" y="470" width="180" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="870" y="496" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Потом</text>
  <text x="870" y="518" text-anchor="middle" font-size="15" fill="#1f2937">API + PostgreSQL,</text>
  <text x="870" y="538" text-anchor="middle" font-size="15" fill="#1f2937">свой сервер</text>

  <!-- Легенда -->
  <line x1="60" y1="490" x2="120" y2="490" stroke="#374151" stroke-width="2"/>
  <text x="132" y="495" font-size="15" fill="#1f2937">работает сейчас</text>
  <line x1="60" y1="525" x2="120" y2="525" stroke="#374151" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="132" y="530" font-size="15" fill="#1f2937">планируется</text>

  <!-- Разработка -->
  <line x1="40" y1="590" x2="960" y2="590" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="620" font-size="16" font-weight="bold" fill="#475569">Разработка</text>

  <rect x="40" y="645" width="260" height="85" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="678" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">GitHub</text>
  <text x="170" y="704" text-anchor="middle" font-size="15" fill="#1f2937">репозиторий, pull request</text>

  <line x1="300" y1="687" x2="370" y2="687" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="370" y="645" width="260" height="85" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="678" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">CI</text>
  <text x="500" y="704" text-anchor="middle" font-size="15" fill="#1f2937">lint, typecheck, тесты, сборка</text>

  <line x1="630" y1="687" x2="700" y2="687" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="700" y="645" width="260" height="85" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="830" y="678" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">Демо</text>
  <text x="830" y="704" text-anchor="middle" font-size="15" fill="#1f2937">GitHub Pages</text>
</svg>
