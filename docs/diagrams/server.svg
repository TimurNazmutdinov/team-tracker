<text x="450.0" y="305" text-anchor="middle" font-size="12" fill="#1f2937">блокировка, права, проверка, транзакция</text>
<rect x="600" y="245" width="270" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="735.0" y="281" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Чтение</text>
<text x="735.0" y="305" text-anchor="middle" font-size="12" fill="#1f2937">проекты, задачи, спринты, история</text>
<path d="M165 325 L165 365" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<path d="M450 325 L450 365" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<path d="M735 325 L735 365" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="365" width="840" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="397" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Drizzle ORM: схема таблиц и миграции (server/migrations)</text>
<path d="M450 440 L450 490" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
