<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Helvetica, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" role="img" aria-label="Компоненты сервера и общий код">
<title>Компоненты сервера и общий код</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="900" height="700" fill="#ffffff"/>
<rect x="15" y="20" width="870" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="450.0" y="51" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Клиент (браузер)</text>
<text x="450.0" y="76" text-anchor="middle" font-size="13" fill="#1f2937">адаптер Api: fetch, cookie сессии; экран входа; права скрывают недоступные действия</text>
<path d="M450 90 L450 130" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<text x="520" y="117" text-anchor="middle" font-size="13" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">HTTP, JSON</text>
