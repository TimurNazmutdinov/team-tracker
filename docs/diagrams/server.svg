<text x="31" y="156" font-size="15" font-weight="bold" fill="#475569">Сервер: Node.js 22 + Fastify 5  (server/src)</text>
<rect x="30" y="165" width="840" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Маршруты: /api/auth, /users, чтение, /commit</text>
<path d="M165 215 L165 245" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<path d="M450 215 L450 245" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<path d="M735 215 L735 245" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<rect x="30" y="245" width="270" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="165.0" y="281" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Вход</text>
<text x="165.0" y="305" text-anchor="middle" font-size="12" fill="#1f2937">scrypt, сессии: хэш токена в базе</text>
<rect x="315" y="245" width="270" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
