<text x="34" y="116" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Проекты: TEST ▾</text>
<circle cx="14" cy="96" r="11" fill="#b91c1c"/>
<text x="14" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
<text x="232" y="116" text-anchor="start" font-size="13" fill="#1f2937">Бэклог  Доска  Спринты  Отчёты  Люди  Настройки</text>
<text x="20" y="176" text-anchor="start" font-size="24" font-weight="bold" fill="#1f2937">Настройки · TEST ▾</text>
<circle cx="14" cy="160" r="11" fill="#b91c1c"/>
<text x="14" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
<text x="20" y="214" text-anchor="start" font-size="13" fill="#6b7280">Экраны одного проекта (Спринты, Отчёты, Люди, Настройки, карточка задачи) показывают проект в заголовке.</text>
<text x="20" y="238" text-anchor="start" font-size="13" fill="#6b7280">Стрелка ▾ рядом открывает список проектов: выбранный сохраняется для этой вкладки.</text>
<line x1="20" y1="270" x2="880" y2="270" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="20" y="300" text-anchor="start" font-size="16" font-weight="bold" fill="#1f2937">Что значит «Проекты: …» в шапке</text>
<text x="20" y="330" text-anchor="start" font-size="13" fill="#1f2937">1. Один выбор на весь продукт: «Мои», «Все» или перечень. Запоминается и отражается в адресе.</text>
<text x="20" y="356" text-anchor="start" font-size="13" fill="#1f2937">2. Доска, планирование, прошлые спринты, портфель и аналитика показывают и считают выбранные проекты.</text>
<text x="20" y="382" text-anchor="start" font-size="13" fill="#1f2937">3. Вкладки в шапке открываются для первого выбранного проекта (или последнего открытого).</text>
<text x="20" y="408" text-anchor="start" font-size="13" fill="#1f2937">4. Чипа проекта в шапке больше нет: он дублировал фильтр и путал.</text>
<circle cx="14" cy="316" r="11" fill="#b91c1c"/>
<text x="14" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
</svg>
