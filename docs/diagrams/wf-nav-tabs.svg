<text x="318" y="238" text-anchor="start" font-size="13" fill="#6b7280">+ Новый проект (администратор)</text>
<circle cx="294" cy="100" r="11" fill="#b91c1c"/>
<text x="294" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
<text x="20" y="300" text-anchor="start" font-size="24" font-weight="bold" fill="#1f2937">Портфель</text>
<text x="20" y="326" text-anchor="start" font-size="13" fill="#6b7280">Вкладки проекта видны и здесь: переход в Бэклог, Доску, Спринты… без возврата в список проектов.</text>
<circle cx="14" cy="96" r="11" fill="#b91c1c"/>
<text x="14" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
<text x="20" y="372" text-anchor="start" font-size="13" fill="#1f2937">1. Чип проекта становится переключателем: текущий проект, быстрый выбор другого, «Все проекты…» (список и создание).</text>
<text x="20" y="398" text-anchor="start" font-size="13" fill="#1f2937">2. Какой проект стоит в чипе на «Портфеле» и «Аналитике»: последний открытый (запоминается), иначе первый из выбранных.</text>
<text x="20" y="424" text-anchor="start" font-size="13" fill="#1f2937">3. Вкладки проекта — те же, что внутри проекта; «Портфель» и «Аналитика» остаются слева и подсвечиваются, когда открыты.</text>
<text x="20" y="450" text-anchor="start" font-size="13" fill="#1f2937">4. Выбор проекта в чипе не меняет фильтр «Проекты: …» на странице: фильтр — про то, что считать, чип — куда переходить.</text>
</svg>
