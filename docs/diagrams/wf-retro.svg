<text x="34" y="590" text-anchor="start" font-size="12.5" fill="#6b7280">Записи может добавлять любой, у кого есть доступ; удаляет автор, тимлид и администратор. Закрытый спринт тоже можно дополнять.</text>
<text x="34" y="610" text-anchor="start" font-size="12.5" fill="#6b7280">«→ в задачу» создаёт задачу в бэклоге (тип Task, название — текст действия) и ставит ссылку DEMO-18 на самой записи.</text>
<text x="34" y="630" text-anchor="start" font-size="12.5" fill="#6b7280">Во вкладке «Прошлые спринты» у раскрытого спринта те же три списка — только чтение, со ссылками на задачи.</text>
