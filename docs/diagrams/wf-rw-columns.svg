<text x="250" y="438.0" text-anchor="middle" font-size="14" fill="#5e5348">▾</text>
<rect x="38" y="466" width="210" height="32" rx="6" fill="#6a5440" stroke="#6a5440" stroke-width="1.2"/>
<text x="143.0" y="486.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">Перенести и удалить</text>
<rect x="260" y="466" width="100" height="32" rx="6" fill="#faf9f5" stroke="#d6cfbf" stroke-width="1.2"/>
<text x="310.0" y="486.5" text-anchor="middle" font-size="12.5" fill="#2b2520">Отмена</text>
<circle cx="14" cy="330" r="11" fill="#9b2c2c"/>
<text x="14" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
<text x="20" y="600" text-anchor="start" font-size="12.5" fill="#5e5348">Колонка = статус. Тип колонки решает, что считается «готово» для velocity, burndown, DoD и отчётов.</text>
<text x="20" y="624" text-anchor="start" font-size="12.5" fill="#5e5348">Изменения сразу видны везде: доски, карточка задачи, массовые действия, фильтры, WIP, отчёты, история.</text>
<text x="20" y="648" text-anchor="start" font-size="12.5" fill="#5e5348">Нужна хотя бы одна колонка «не начато» и одна «готово». Колонка «Бэклог» вне доски — служебная.</text>
<text x="20" y="672" text-anchor="start" font-size="12.5" fill="#5e5348">Право «Колонки досок» — отдельная строка в таблице ролей. Пустую колонку удалить можно сразу.</text>
<circle cx="14" cy="588" r="11" fill="#9b2c2c"/>
<text x="14" y="593" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
</svg>
