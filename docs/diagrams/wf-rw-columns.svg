<text x="38" y="360" text-anchor="start" font-size="15" font-weight="bold" fill="#2b2520">Удалить колонку «Тестирование»?</text>
<text x="38" y="386" text-anchor="start" font-size="12.5" fill="#2b2520">В колонке 2 задачи. Куда их перенести:</text>
