<text x="40" y="400" text-anchor="start" font-size="16" font-weight="bold" fill="#1f2937">Правила подсказок</text>
<text x="40" y="428" text-anchor="start" font-size="13" fill="#1f2937">• Есть у всех кнопок-значков, сокращений, чипов, статусов, фильтров, полей настроек и переключателей.</text>
<text x="40" y="454" text-anchor="start" font-size="13" fill="#1f2937">• Текст — одна короткая фраза: что это и что произойдёт. Без повторения подписи кнопки.</text>
<text x="40" y="480" text-anchor="start" font-size="13" fill="#1f2937">• То же текстом для чтецов экрана (aria-label / описание), не только мышь.</text>
<text x="40" y="506" text-anchor="start" font-size="13" fill="#1f2937">• Появляется при наведении и при фокусе с клавиатуры; не закрывает поле, к которому относится.</text>
