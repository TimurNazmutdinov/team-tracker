<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" role="img" aria-label="Карта экранов и адресов">
<title>Карта экранов и адресов</title>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="20" y="20" width="200" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="120.0" y="44" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Проекты</text>
<text x="120.0" y="64" text-anchor="middle" font-size="12" fill="#6b7280">/ и /projects</text>
<text x="120.0" y="81" text-anchor="middle" font-size="12" fill="#6b7280">один проект — сразу бэклог</text>
<rect x="310" y="20" width="270" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="445.0" y="44" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Проект</text>
<text x="445.0" y="64" text-anchor="middle" font-size="12" fill="#6b7280">/projects/:key → бэклог</text>
<line x1="220" y1="52" x2="310" y2="52" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="310" cy="52" r="3.5" fill="#1f2937"/>
<rect x="20" y="150" width="134" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="87.0" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Бэклог</text>
<text x="87.0" y="194" text-anchor="middle" font-size="12" fill="#6b7280">…/backlog</text>
<line x1="445" y1="84" x2="87" y2="150" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="87" cy="150" r="3.5" fill="#1f2937"/>
<rect x="166" y="150" width="134" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="233.0" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Доска</text>
<text x="233.0" y="194" text-anchor="middle" font-size="12" fill="#6b7280">…/board</text>
<line x1="445" y1="84" x2="233" y2="150" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="233" cy="150" r="3.5" fill="#1f2937"/>
<rect x="312" y="150" width="134" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="379.0" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Спринты</text>
<text x="379.0" y="194" text-anchor="middle" font-size="12" fill="#6b7280">…/sprints</text>
<line x1="445" y1="84" x2="379" y2="150" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="379" cy="150" r="3.5" fill="#1f2937"/>
<rect x="458" y="150" width="134" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="525.0" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Отчёты</text>
<text x="525.0" y="194" text-anchor="middle" font-size="12" fill="#6b7280">…/reports</text>
<line x1="445" y1="84" x2="525" y2="150" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="525" cy="150" r="3.5" fill="#1f2937"/>
<rect x="604" y="150" width="134" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="671.0" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Люди</text>
<text x="671.0" y="194" text-anchor="middle" font-size="12" fill="#6b7280">…/people</text>
<line x1="445" y1="84" x2="671" y2="150" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="671" cy="150" r="3.5" fill="#1f2937"/>
<rect x="750" y="150" width="134" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="817.0" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Настройки</text>
<text x="817.0" y="194" text-anchor="middle" font-size="12" fill="#6b7280">…/settings</text>
<line x1="445" y1="84" x2="817" y2="150" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="817" cy="150" r="3.5" fill="#1f2937"/>
<rect x="20" y="300" width="250" height="74" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="145.0" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Спринт</text>
<text x="145.0" y="344" text-anchor="middle" font-size="12" fill="#6b7280">/projects/:key/sprints/:id</text>
<text x="145.0" y="361" text-anchor="middle" font-size="12" fill="#6b7280">цель, состав, итоги</text>
<rect x="325" y="300" width="250" height="74" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="450.0" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Задача</text>
<text x="450.0" y="344" text-anchor="middle" font-size="12" fill="#6b7280">/projects/:key/issues/:n</text>
<text x="450.0" y="361" text-anchor="middle" font-size="12" fill="#6b7280">карточка, связи, история</text>
<line x1="100" y1="214" x2="145" y2="300" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="145" cy="300" r="3.5" fill="#1f2937"/>
<line x1="276" y1="214" x2="400" y2="300" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="400" cy="300" r="3.5" fill="#1f2937"/>
<line x1="100" y1="214" x2="400" y2="300" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="400" cy="300" r="3.5" fill="#1f2937"/>
<line x1="452" y1="214" x2="450" y2="300" stroke="#1f2937" stroke-width="1.8"/>
<circle cx="450" cy="300" r="3.5" fill="#1f2937"/>
<line x1="630" y1="214" x2="450" y2="300" stroke="#1f2937" stroke-width="1.8" stroke-dasharray="6 4"/>
<circle cx="450" cy="300" r="3.5" fill="#1f2937"/>
<text x="640" y="316" text-anchor="start" font-size="12" fill="#6b7280">Из бэклога, доски, спринта</text>
<text x="640" y="334" text-anchor="start" font-size="12" fill="#6b7280">и поиска открывается карточка</text>
<text x="20" y="420" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Окна поверх экрана (свой адрес не нужен):</text>
<rect x="20" y="440" width="205" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="122.5" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Создать задачу</text>
<text x="122.5" y="484" text-anchor="middle" font-size="12" fill="#6b7280">C или кнопка</text>
<rect x="240" y="440" width="205" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="342.5" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Закрыть спринт</text>
<text x="342.5" y="484" text-anchor="middle" font-size="12" fill="#6b7280">кнопка в спринте</text>
<rect x="460" y="440" width="205" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="562.5" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Новый проект</text>
<text x="562.5" y="484" text-anchor="middle" font-size="12" fill="#6b7280">кнопка на «Проекты»</text>
<rect x="680" y="440" width="205" height="64" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="782.5" y="464" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Поиск и клавиши</text>
<text x="782.5" y="484" text-anchor="middle" font-size="12" fill="#6b7280">/ и ?</text>
<text x="20" y="540" text-anchor="start" font-size="12" fill="#6b7280">Стрелка — переход. Пунктир — окно или редкий переход.</text>
</svg>
