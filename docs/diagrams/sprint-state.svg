<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" font-family="Helvetica, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" role="img" aria-label="Состояния спринта">
<title>Состояния спринта</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="900" height="170" fill="#ffffff"/>
<rect x="40" y="50" width="200" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="140.0" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">planned</text>
<text x="140.0" y="106" text-anchor="middle" font-size="14" fill="#1f2937">запланирован</text>
<rect x="350" y="50" width="200" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">active</text>
<text x="450.0" y="106" text-anchor="middle" font-size="14" fill="#1f2937">идёт</text>
<rect x="660" y="50" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="760.0" y="81" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">closed</text>
<text x="760.0" y="106" text-anchor="middle" font-size="13" fill="#1f2937">закрыт, только чтение</text>
<path d="M240 85 L350 85" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<text x="295" y="71" text-anchor="middle" font-size="13" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">запуск</text>
<path d="M550 85 L660 85" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
<text x="605" y="71" text-anchor="middle" font-size="13" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">закрытие</text>
<text x="450" y="150" text-anchor="middle" font-size="14" fill="#475569">Один активный спринт на проект; при закрытии незавершённое переносится</text>
</svg>
