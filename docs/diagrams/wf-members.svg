<text x="30" y="502" text-anchor="start" font-size="12.5" fill="#6b7280">«Мои проекты» — те, где вы владелец или участник; администратор может выбрать «Все проекты».</text>
<text x="30" y="522" text-anchor="start" font-size="12.5" fill="#6b7280">Продакт меняет состав и порядок задач, приоритеты и спринты только в своих проектах (владелец или участник).</text>
<text x="30" y="542" text-anchor="start" font-size="12.5" fill="#6b7280">Тимлид, администратор и разработчик (статусы своих задач) работают, как раньше.</text>
<text x="30" y="562" text-anchor="start" font-size="12.5" fill="#6b7280">Владельца и участников меняют администратор и владелец проекта. Макет, не готовый экран.</text>
