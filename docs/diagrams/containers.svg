<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" role="img" aria-label="Контейнеры: SPA, API, PostgreSQL, CI/CD, демо">
<title>Контейнеры: SPA, API, PostgreSQL, CI/CD, демо</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="30" y="40" width="220" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
