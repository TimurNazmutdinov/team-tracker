<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="Helvetica, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" role="img" aria-label="Статусы задачи: допустим любой переход">
<title>Статусы задачи: допустим любой переход</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="900" height="250" fill="#ffffff"/>
<rect x="15" y="70" width="130" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="80.0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Backlog</text>
<rect x="200" y="70" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="265.0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">To Do</text>
<rect x="385" y="70" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="450.0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">In Progress</text>
<rect x="570" y="70" width="130" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="635.0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Review</text>
<rect x="755" y="70" width="130" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="820.0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Done</text>
<path d="M145 100 L200 100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M330 100 L385 100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M515 100 L570 100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M700 100 L755 100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M80 130 L80 190 L820 190 L820 130" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="450" y="195" text-anchor="middle" font-size="13" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">допустим любой переход, в том числе пропуск и возврат</text>
<text x="15" y="30" text-anchor="start" font-size="14" fill="#475569">Обычный путь слева направо; каждая смена статуса пишется в историю</text>
</svg>
