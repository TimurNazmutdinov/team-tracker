<text x="866" y="70" text-anchor="middle" font-size="13" fill="#6b7280">▾</text>
<text x="20" y="128" text-anchor="start" font-size="24" font-weight="bold" fill="#1f2937">Настройки проекта</text>
<text x="20" y="176" text-anchor="start" font-size="18" font-weight="bold" fill="#1f2937">Спринты</text>
<text x="20" y="200" text-anchor="start" font-size="13" fill="#6b7280">Значения подставляются в форму нового спринта; названия и даты каждого спринта можно изменить на экране «Спринты».</text>
<text x="20" y="236" text-anchor="start" font-size="12" fill="#6b7280">Длительность по умолчанию, дней</text>
<rect x="20" y="242" width="400" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="30" y="264" text-anchor="start" font-size="14" fill="#1f2937">14</text>
<text x="20" y="292" text-anchor="start" font-size="11" fill="#6b7280">От 1 до 90; конец = старт + длительность − 1 день</text>
<circle cx="6" cy="236" r="11" fill="#b91c1c"/>
<text x="6" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
<text x="450" y="236" text-anchor="start" font-size="12" fill="#6b7280">Название: префикс</text>
<rect x="450" y="242" width="400" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="460" y="264" text-anchor="start" font-size="14" fill="#1f2937">Спринт</text>
<text x="450" y="292" text-anchor="start" font-size="11" fill="#6b7280">Например, «Спринт» или «Итерация»</text>
<circle cx="436" cy="236" r="11" fill="#b91c1c"/>
<text x="436" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
<text x="20" y="322" text-anchor="start" font-size="12" fill="#6b7280">Номер следующего спринта</text>
<rect x="20" y="328" width="400" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="30" y="350" text-anchor="start" font-size="14" fill="#1f2937">4</text>
<text x="20" y="378" text-anchor="start" font-size="11" fill="#6b7280">Растёт сам, когда создаётся спринт с предложенным названием</text>
<circle cx="6" cy="322" r="11" fill="#b91c1c"/>
<text x="6" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
<text x="450" y="322" text-anchor="start" font-size="12" fill="#6b7280">Дата старта следующего спринта</text>
<rect x="450" y="328" width="400" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="450" y="378" text-anchor="start" font-size="11" fill="#6b7280">Если пусто — на следующий день после конца последнего спринта</text>
<circle cx="436" cy="322" r="11" fill="#b91c1c"/>
<text x="436" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
<rect x="20" y="410" width="830" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="36" y="438" text-anchor="start" font-size="15" font-weight="bold" fill="#1f2937">Следующий спринт: «Спринт 4», 21.11.2026 – 04.12.2026</text>
<circle cx="14" cy="410" r="11" fill="#b91c1c"/>
<text x="14" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
<rect x="20" y="480" width="140" height="38" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.2"/>
<text x="90.0" y="504.04" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Сохранить</text>
