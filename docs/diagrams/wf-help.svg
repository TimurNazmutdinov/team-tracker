<text x="250.24" y="167" text-anchor="middle" font-size="14" fill="#1f2937">Правила</text>
<rect x="299.68" y="146" width="129.92000000000002" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="364.64" y="167" text-anchor="middle" font-size="14" fill="#1f2937">Кто что может</text>
<circle cx="100" cy="146" r="11" fill="#b91c1c"/>
<text x="100" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
<rect x="114" y="192" width="220" height="28" rx="5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="124" y="211" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">Ctrl+K  ·  /</text>
<text x="350" y="211" text-anchor="start" font-size="13" fill="#1f2937">Поиск и команды</text>
<rect x="114" y="230" width="220" height="28" rx="5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="124" y="249" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">C</text>
<text x="350" y="249" text-anchor="start" font-size="13" fill="#1f2937">Создать задачу</text>
<rect x="114" y="268" width="220" height="28" rx="5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="124" y="287" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">G, затем D / B / H / S / R / P</text>
<text x="350" y="287" text-anchor="start" font-size="13" fill="#1f2937">Доска, планирование, прошлые спринты, спринты, отчёты,…</text>
<rect x="114" y="306" width="220" height="28" rx="5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="124" y="325" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">?</text>
<text x="350" y="325" text-anchor="start" font-size="13" fill="#1f2937">Эта справка</text>
<rect x="114" y="344" width="220" height="28" rx="5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="124" y="363" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">Ctrl+Enter</text>
<text x="350" y="363" text-anchor="start" font-size="13" fill="#1f2937">Сохранить форму или отправить комментарий</text>
<rect x="114" y="382" width="220" height="28" rx="5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="124" y="401" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">Esc</text>
<text x="350" y="401" text-anchor="start" font-size="13" fill="#1f2937">Закрыть окно</text>
<circle cx="100" cy="194" r="11" fill="#b91c1c"/>
<text x="100" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
<text x="114" y="444" text-anchor="start" font-size="12" fill="#6b7280">Клавиши не срабатывают, пока фокус в поле ввода.</text>
<line x1="114" y1="468" x2="786" y2="468" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="114" y="498" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">Вкладка «Правила» — коротко и простым языком:</text>
<text x="114" y="524" text-anchor="start" font-size="12.5" fill="#6b7280">• Статусы: Backlog → To Do → In Progress → Review → Done; допустим любой переход.</text>
<text x="114" y="548" text-anchor="start" font-size="12.5" fill="#6b7280">• Story points — целое число; у Epic и подзадач их нет.</text>
<text x="114" y="572" text-anchor="start" font-size="12.5" fill="#6b7280">• Спринт: один идущий; закрытие переносит незавершённое по выбору.</text>
<text x="114" y="596" text-anchor="start" font-size="12.5" fill="#6b7280">• Перенос: с доски за ручку ⋮⋮, в планировании — между спринтами.</text>
<text x="114" y="620" text-anchor="start" font-size="12.5" fill="#6b7280">• WIP-лимит: превышение — предупреждение, запрета нет.</text>
<text x="114" y="644" text-anchor="start" font-size="12.5" fill="#6b7280">• Definition of Done: перед Done подтверждаются пункты проекта.</text>
<circle cx="100" cy="484" r="11" fill="#b91c1c"/>
<text x="100" y="489" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
<line x1="114" y1="682" x2="786" y2="682" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="114" y="712" text-anchor="start" font-size="13" fill="#6b7280">Вкладка «Кто что может» — таблица прав по ролям (из той же проверки, что на сервере).</text>
<circle cx="100" cy="696" r="11" fill="#b91c1c"/>
<text x="100" y="701" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
<rect x="114" y="674" width="230" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="229.0" y="695.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Запустить мастер первого запуска</text>
<circle cx="100" cy="674" r="11" fill="#b91c1c"/>
<text x="100" y="679" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
<text x="360" y="696" text-anchor="start" font-size="12" fill="#6b7280">только администратор</text>
