<svg xmlns="http://www.w3.org/2000/svg" width="900" height="745" viewBox="0 0 900 745" font-family="Helvetica, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" role="img" aria-label="seq-commit">
<title>seq-commit</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="900" height="745" fill="#ffffff"/>
