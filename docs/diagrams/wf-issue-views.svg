<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica, Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" role="img" aria-label="Единый вид задачи: карточка, сжатая строка, подробная строка">
<title>Единый вид задачи: карточка, сжатая строка, подробная строка</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="20" y="28" text-anchor="start" font-size="12.5" fill="#6b7280">Одна и та же задача DEMO-19 в четырёх видах. Сжатый вид везде содержит: тип · ключ · название · points · приоритет · исполнитель.</text>
<text x="20" y="58" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">1. Карточка на доске</text>
<rect x="20" y="68" width="210" height="92" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="26" y="74" width="15" height="15" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="33.5" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">T</text>
<text x="46" y="86" text-anchor="start" font-size="11" font-weight="bold" fill="#2563eb">DEMO-19</text>
<text x="26" y="102" text-anchor="start" font-size="11" fill="#1f2937">Фильтр заказов по дате</text>
<text x="34" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">▲</text>
<circle cx="186" cy="146" r="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="186" y="150.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">5</text>
<circle cx="214" cy="146" r="10" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="214" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">ИС</text>
<circle cx="14" cy="66" r="11" fill="#b91c1c"/>
<text x="14" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
<text x="250" y="58" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">2. Строка слева (выполнено): без приоритета</text>
<rect x="250" y="68" width="290" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="256" y="73" width="16" height="16" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="264.0" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">T</text>
<text x="277" y="85" text-anchor="start" font-size="11" font-weight="bold" fill="#2563eb">DEMO-19</text>
<circle cx="524" cy="82" r="8.5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="524" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">ИС</text>
<circle cx="501" cy="82" r="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="501" y="86.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">5</text>
<text x="258" y="101" text-anchor="start" font-size="11" fill="#1f2937">Фильтр заказов по дате</text>
<text x="250" y="126" text-anchor="start" font-size="11.5" fill="#6b7280">ключ · название · points · исполнитель</text>
<circle cx="244" cy="66" r="11" fill="#b91c1c"/>
<text x="244" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
<text x="560" y="58" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">3. Строка справа (бэклог): без исполнителя</text>
<rect x="560" y="68" width="320" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="566" y="85" text-anchor="start" font-size="11" fill="#6b7280">⋮⋮</text>
<rect x="580" y="73" width="16" height="16" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="588.0" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">T</text>
<text x="601" y="85" text-anchor="start" font-size="11" font-weight="bold" fill="#2563eb">DEMO-19</text>
<circle cx="863" cy="82" r="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="863" y="86.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">5</text>
<text x="840" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">▲</text>
<text x="568" y="101" text-anchor="start" font-size="11" fill="#1f2937">Фильтр заказов по дате</text>
<text x="560" y="126" text-anchor="start" font-size="11.5" fill="#6b7280">ручка · ключ · название · приоритет · points</text>
<circle cx="554" cy="66" r="11" fill="#b91c1c"/>
<text x="554" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
<text x="20" y="196" text-anchor="start" font-size="13" font-weight="bold" fill="#1f2937">4. Подробная строка в «Бэклоге»: все поля, points, приоритет и исполнитель правятся прямо в строке</text>
<rect x="20" y="208" width="860" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="28" y="231" text-anchor="start" font-size="13" fill="#6b7280">⋮⋮</text>
<circle cx="54" cy="226" r="4.5" fill="#dbeafe" stroke="#6b7280" stroke-width="1"/>
<rect x="64" y="217" width="18" height="18" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
<text x="73.0" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">T</text>
<text x="89" y="231" text-anchor="start" font-size="12" font-weight="bold" fill="#2563eb">DEMO-19</text>
<text x="146" y="231" text-anchor="start" font-size="13" fill="#1f2937">Фильтр заказов по дате</text>
<rect x="346" y="215" width="52.96" height="22" rx="11.0" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="372.48" y="229.96" text-anchor="middle" font-size="11" fill="#1f2937">Заказы</text>
<rect x="420" y="216" width="51.28" height="20" rx="10.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="445.64" y="229.78" text-anchor="middle" font-size="10.5" fill="#1f2937">заказы</text>
<text x="477.28" y="231" text-anchor="start" font-size="11" fill="#6b7280">+1</text>
<rect x="548" y="215" width="71.19999999999999" height="22" rx="11.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="583.6" y="230.14" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">▲ High ▾</text>
<rect x="660" y="214" width="54" height="24" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="682" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">5</text>
<text x="702" y="230" text-anchor="middle" font-size="10" fill="#6b7280">✎</text>
<rect x="726" y="214" width="146" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<circle cx="742" cy="226" r="9" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="742" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">ИС</text>
<text x="758" y="231" text-anchor="start" font-size="12" fill="#1f2937">Игорь С.</text>
<text x="862" y="231" text-anchor="middle" font-size="11" fill="#6b7280">▾</text>
<circle cx="14" cy="206" r="11" fill="#b91c1c"/>
<text x="14" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
<text x="20" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">ручка</text>
<text x="66" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">тип</text>
<text x="84" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">ключ</text>
<text x="146" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">название</text>
<text x="346" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">эпик</text>
<text x="420" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">метки</text>
<text x="548" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">приоритет ▾</text>
<text x="660" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">points ✎</text>
<text x="726" y="262" text-anchor="start" font-size="10.5" fill="#6b7280">исполнитель ▾</text>
<rect x="20" y="280" width="860" height="130" rx="6" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="34" y="304" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">Правило единства</text>
<text x="34" y="320" text-anchor="start" font-size="12" fill="#6b7280">Порядок и значки одинаковы: тип, ключ синим, название, приоритет, points в кружке, аватар.</text>
<text x="34" y="340" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">Что добавляет подробный вид</text>
<text x="34" y="356" text-anchor="start" font-size="12" fill="#6b7280">Эпик, метки, точка статуса и поля правки. Всё это нужно при планировании и не нужно для беглого взгляда.</text>
<text x="34" y="376" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1f2937">Что убирает узкий вид</text>
<text x="34" y="392" text-anchor="start" font-size="12" fill="#6b7280">Название сокращается до ширины, а в самой узкой карточке (центр зажат) остаются ключ, points и исполнитель.</text>
</svg>
